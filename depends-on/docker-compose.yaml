version: "3.9"

services:
  mongodb-example:
    image: mongo:latest
    container_name: mongodb-example
    ports:
      - "27017:27017"
    environment:
      MONGODB_INITDB_ROOT_USERNAME: rafee
      MONGODB_INITDB_ROOT_PASSWORD: rafee
      MONGODB_INITDB_DATABASE: admin
    networks:
      - network-example

  mongodb-express-example:
    image: mongo-express:latest
    container_name: mongo-express-example
    ports:
      - "8081:8081"
    restart: always
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: rafee
      ME_CONFIG_MONGODB_ADMINPASSWORD: rafee
      ME_CONFIG_MONGODB_SERVER: mongodb://mongodb-example:27017/
    networks:
      - network-example
    depends_on:
      - mongodb-example

networks:
  network-example:
    name: network-example
    driver: bridge