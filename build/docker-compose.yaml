version: "3.8"

services:
  app:
    container_name: app
    image: "app-golang:1.0.0"
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 200M
        reservations:
          cpus: "0.25"
          memory: 100M
    environment:
      - "APP_PORT=8080"